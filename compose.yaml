name: sub-pool

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sub_pool
      POSTGRES_USER: sub_pool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      SUB_POOL_DATABASE_URL: ${SUB_POOL_DATABASE_URL:-}
    entrypoint:
      - bash
      - -ec
      - |
        if [[ -n "$$SUB_POOL_DATABASE_URL" && ! -s "$$PGDATA/PG_VERSION" ]]; then
          # The image initializes the role with the decoded password from the URI.
          authority="$${SUB_POOL_DATABASE_URL#*://}"
          authority="$${authority%%[/?#]*}"
          userinfo="$${authority%@*}"
          if [[ "$$userinfo" == "$$authority" || "$$userinfo" != *:?* ]]; then
            echo 'Set SUB_POOL_DATABASE_URL to a PostgreSQL URI with a username and password.' >&2
            exit 1
          fi
          password="$${userinfo#*:}"
          printf -v POSTGRES_PASSWORD '%b' "$${password//%/\\x}"
          export POSTGRES_PASSWORD
        fi
        exec docker-entrypoint.sh "$$@"
      - postgres-entrypoint
    command: ["postgres"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sub_pool", "-d", "sub_pool"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${SUB_POOL_IMAGE:-ghcr.io/dslzl/sub-pool}:${IMAGE_TAG:-main}
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUB_POOL_DATABASE_URL: ${SUB_POOL_DATABASE_URL:-postgres://sub_pool@postgres:5432/sub_pool?sslmode=disable}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      SUB_POOL_SECRET_KEY: ${SUB_POOL_SECRET_KEY:?Set a persistent base64-encoded 32-byte SUB_POOL_SECRET_KEY in .env}
      SUB_POOL_INITIAL_ADMIN_PASSWORD:
      SUB_POOL_PUBLIC_ORIGIN: ${SUB_POOL_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      SUB_POOL_ALLOW_LOOPBACK_HTTP: "true"
      SUB_POOL_LOG_LEVEL: ${SUB_POOL_LOG_LEVEL:-info}
      SUB_POOL_DB_MAX_CONNS: ${SUB_POOL_DB_MAX_CONNS:-25}
      SUB_POOL_UPSTREAM_READ_TIMEOUT: ${SUB_POOL_UPSTREAM_READ_TIMEOUT:-15s}
      SUB_POOL_UPSTREAM_CONNECT_TIMEOUT: ${SUB_POOL_UPSTREAM_CONNECT_TIMEOUT:-5s}
      SUB_POOL_DISABLE_UPSTREAM_WRITES: ${SUB_POOL_DISABLE_UPSTREAM_WRITES:-false}
      SUB_POOL_BACKUP_MAX_BYTES: ${SUB_POOL_BACKUP_MAX_BYTES:-2000000000}
      SUB_POOL_BACKUP_TIMEOUT: ${SUB_POOL_BACKUP_TIMEOUT:-10m}
      SUB_POOL_HOST: 0.0.0.0
      SUB_POOL_PORT: "3000"
    ports:
      - "${SUB_POOL_BIND:-127.0.0.1}:${SUB_POOL_PORT:-3000}:3000"

volumes:
  postgres-data:
