name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Product checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: subpool_test_ci
          POSTGRES_USER: sub_pool
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub_pool -d subpool_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Backend integration tests and vet
        working-directory: backend
        env:
          SUB_POOL_TEST_DATABASE_URL: postgres://sub_pool:isolated-ci-only@127.0.0.1:5432/subpool_test_ci?sslmode=disable
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -X -U sub_pool -d subpool_test_ci -c "SELECT current_setting('jit') AS jit, pg_jit_available() AS jit_available;"
          go test -p 1 ./...
          go vet ./...
      - name: Frontend, contracts and startup checks
        run: |
          bun install --frozen-lockfile
          bun run --cwd contracts typecheck
          bun run --cwd web typecheck
          bun run --cwd contracts test
          bun run --cwd web test
          node --test scripts/start.test.mjs

  native:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-26.04 }
          - { os: linux, arch: arm64, runner: ubuntu-26.04-arm }
          - { os: darwin, arch: amd64, runner: macos-26-intel }
          - { os: darwin, arch: arm64, runner: macos-26 }
          - { os: windows, arch: amd64, runner: windows-2025-vs2026 }
          - { os: windows, arch: arm64, runner: windows-11-vs2026-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Build native backend and frontend
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          package="sub-pool-$TARGET_OS-$TARGET_ARCH"
          mkdir -p "dist/$package"
          extension=""
          if [ "$TARGET_OS" = windows ]; then extension=".exe"; fi
          (cd backend && go build -trimpath -ldflags="-s -w" -o "../dist/$package/sub-pool$extension" ./cmd/sub-pool)
          # Hoisting keeps dependency resolution intact when archive symlinks are dereferenced.
          bun install --frozen-lockfile --linker hoisted
          bun run --cwd web build
      - name: Package relocatable standalone application
        env:
          PACKAGE: sub-pool-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          mkdir -p "dist/$PACKAGE/frontend"
          cp -RL web/.next/standalone/. "dist/$PACKAGE/frontend/"
          cp -R web/.next/static "dist/$PACKAGE/frontend/web/.next/static"
          cp start.mjs README.md .env.example "dist/$PACKAGE/"
          printf 'commit=%s\ngo=%s\nnode=%s\nbun=%s\n' "$GITHUB_SHA" "$(go version)" "$(node --version)" "$(bun --version)" > "dist/$PACKAGE/BUILD-INFO.txt"
      - name: Smoke-test packaged executable and static assets
        env:
          PACKAGE: sub-pool-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { spawn, spawnSync } from 'node:child_process';
          import { once } from 'node:events';
          import { resolve } from 'node:path';
          import { setTimeout as delay } from 'node:timers/promises';
          const root = resolve('dist', process.env.PACKAGE);
          const binary = resolve(root, process.platform === 'win32' ? 'sub-pool.exe' : 'sub-pool');
          const probe = spawnSync(binary, ['migrate'], { env: { ...process.env, SUB_POOL_DATABASE_URL: '' }, timeout: 10000 });
          assert.equal(probe.error, undefined, 'native executable must run');
          assert.equal(probe.status, 1, 'missing database must fail closed');
          const server = spawn(process.execPath, [resolve(root, 'frontend/web/server.js')], {
            cwd: root, stdio: 'inherit', env: { ...process.env, HOSTNAME: '127.0.0.1', PORT: '3100' }
          });
          const closed = once(server, 'close');
          try {
            let response;
            for (let attempt = 0; attempt < 120; attempt++) {
              try { response = await fetch('http://127.0.0.1:3100/login'); if (response.ok) break; } catch {}
              await delay(250);
            }
            assert.ok(response?.ok, 'relocated frontend must start');
            assert.ok((await fetch('http://127.0.0.1:3100/change-password')).ok, 'initial password page must exist');
            const landing = await fetch('http://127.0.0.1:3100/', { redirect: 'manual' });
            assert.equal(landing.status, 307);
            assert.equal(new URL(landing.headers.get('location'), landing.url).pathname, '/console');
            const pages = ['accounts', 'api-keys', 'backup', 'balances', 'connection', 'dispatch', 'estimates', 'help', 'maintenance', 'notifications', 'observations', 'pools', 'pricing', 'profile', 'security', 'temporary', 'usage', 'users'];
            for (const page of pages) {
              const legacy = await fetch('http://127.0.0.1:3100/' + page + '?restore=kept', { redirect: 'manual' });
              assert.equal(legacy.status, 308);
              const target = new URL(legacy.headers.get('location'), legacy.url);
              assert.equal(target.pathname, '/console/' + page);
              assert.equal(target.searchParams.get('restore'), 'kept');
              assert.ok((await fetch(target)).ok, 'console route must exist: ' + page);
            }
            const html = await response.text();
            const asset = html.match(/\/_next\/static\/[^"\s]+\.css(?:\?[^"\s]*)?/);
            assert.ok(asset, 'login page must reference CSS');
            assert.ok((await fetch(new URL(asset[0].replaceAll('&amp;', '&'), 'http://127.0.0.1:3100'))).ok, 'packaged CSS must exist');
          } finally {
            server.kill();
            await closed;
          }
          JS
      - name: Startup lifecycle checks
        run: node --test scripts/start.test.mjs
      - name: Archive and checksum
        env:
          PACKAGE: sub-pool-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          tar -czf "dist/$PACKAGE.tar.gz" -C dist "$PACKAGE"
          node --input-type=module - "$PACKAGE" <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const file = process.argv[2] + '.tar.gz';
          const hash = createHash('sha256').update(readFileSync('dist/' + file)).digest('hex');
          writeFileSync('dist/' + file + '.sha256', hash + '  ' + file + '\n');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sub-pool-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  container:
    name: Container linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Prepare isolated deployment
        shell: bash
        run: |
          SUB_POOL_DATABASE_URL="postgres://sub_pool:$(openssl rand -hex 32)-%40%2F@postgres:5432/sub_pool?sslmode=disable"
          SUB_POOL_SECRET_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$SUB_POOL_DATABASE_URL"
          echo "::add-mask::$SUB_POOL_SECRET_KEY"
          printf '%s\n' "SUB_POOL_DATABASE_URL=$SUB_POOL_DATABASE_URL" "SUB_POOL_SECRET_KEY=$SUB_POOL_SECRET_KEY" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.image.outputs.name }}:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sub-pool-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sub-pool-${{ matrix.arch }}
          provenance: false
      - name: Compose automatic administrator, login and persistence
        env:
          SUB_POOL_IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ci-${{ matrix.arch }}
        shell: bash
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { randomBytes } from 'node:crypto';
          import { setTimeout as delay } from 'node:timers/promises';
          const origin = 'http://127.0.0.1:3000';
          function compose(...args) {
            try {
              return execFileSync('docker', ['compose', ...args], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
            } catch {
              throw new Error('Docker Compose failed during ' + args[0]);
            }
          }
          function initialEvents() {
            return compose('logs', '--no-color', '--no-log-prefix', 'app').split(/\r?\n/)
              .filter(line => line.includes('"event":"initial_admin_password"')).map(line => {
                try { return JSON.parse(line); } catch { throw new Error('Invalid initial password event'); }
              });
          }
          function request(path, { body, cookie, source = origin } = {}) {
            const headers = { Origin: source };
            if (cookie) headers.Cookie = cookie;
            if (body) headers['Content-Type'] = 'application/json';
            return fetch(origin + '/api/v1/' + path, {
              method: body ? 'POST' : 'GET', headers, body: JSON.stringify(body), signal: AbortSignal.timeout(10000),
            });
          }
          function login(password, source) {
            return request('auth/login', { body: { username: 'admin', password }, source });
          }
          function sessionCookie(response) {
            const cookie = response.headers.getSetCookie()[0]?.split(';')[0];
            assert.ok(cookie, 'login must issue a session cookie');
            return cookie;
          }
          assert.ok((await fetch(origin + '/health')).ok, 'frontend must reach Go');
          const events = initialEvents();
          assert.equal(events.length, 1, 'startup must deliver the generated password once');
          const { username, password } = events[0];
          assert.ok(username === 'admin' && typeof password === 'string' && /^[A-Za-z0-9_-]{20}$/.test(password), 'invalid initial credential shape');
          const next = 'Changed' + randomBytes(20).toString('hex');
          console.log('::add-mask::' + password);
          console.log('::add-mask::' + next);
          assert.equal((await login(password, 'https://unrelated.invalid')).status, 403, 'foreign Origin must be rejected');
          assert.equal((await login('admin')).status, 401, 'the historical password must be rejected');
          const initial = await login(password);
          assert.equal(initial.status, 200);
          const pending = await initial.json();
          assert.equal(pending.user.role, 'admin');
          assert.equal(pending.must_change_password, true);
          const cookie = sessionCookie(initial);
          compose('restart', 'app');
          compose('up', '-d', '--no-build', '--wait', '--wait-timeout', '120');
          assert.equal(initialEvents().length, 1, 'restart must not deliver another password');
          const session = await request('auth/session', { cookie });
          assert.equal(session.status, 200);
          const restored = await session.json();
          assert.equal(restored.user.username, 'admin');
          assert.equal(restored.must_change_password, true);
          for (const denied of [await request('access', { cookie }), await request('auth/renew', { cookie, body: {} })]) {
            assert.equal(denied.status, 403);
            assert.equal((await denied.json()).code, 'PASSWORD_CHANGE_REQUIRED');
          }
          assert.equal((await request('auth/password', { cookie, body: { current_password: password, new_password: next } })).status, 200);
          assert.equal((await request('auth/session', { cookie })).status, 401);
          assert.equal((await login(password)).status, 401);
          const changed = await login(next);
          assert.equal(changed.status, 200);
          assert.ok(!(await changed.json()).must_change_password);
          assert.equal((await request('access', { cookie: sessionCookie(changed) })).status, 200);
          let ready = false;
          for (let attempt = 0; attempt < 20; attempt++) {
            ready = (await fetch(origin + '/health/ready', { signal: AbortSignal.timeout(5000) })).ok;
            if (ready) break;
            await delay(1000);
          }
          assert.ok(ready, 'migrations and workers must be ready');
          const html = await (await fetch(origin + '/login')).text();
          const asset = html.match(/\/_next\/static\/[^"\s]+\.css(?:\?[^"\s]*)?/);
          assert.ok(asset);
          assert.ok((await fetch(new URL(asset[0].replaceAll('&amp;', '&'), origin))).ok, 'container CSS must exist');
          JS
      - name: Show deployment logs on failure
        if: failure() && env.SUB_POOL_DATABASE_URL != ''
        shell: bash
        run: docker compose logs --no-color --tail 100 2>&1 | awk '!/"event":"initial_admin_password"/'
      - name: Stop isolated deployment
        if: always() && env.SUB_POOL_DATABASE_URL != ''
        run: docker compose down -v --remove-orphans
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested platform image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag "$IMAGE:ci-$ARCH" "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    name: Publish multiarch manifest
    needs: [checks, native, container]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          flavor: latest=false
      - name: Merge verified platform images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
          printf 'Published `%s:sha-%s` (linux/amd64, linux/arm64)\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
